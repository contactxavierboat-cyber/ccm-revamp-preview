<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cigar Club Miami | Book your event</title>
<meta name="description" content="Downtown Miami cigar lounge &amp; bar. Private events for up to 50. 106 NE 1st St. 21+.">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{--green:#1d2a1f;--deep:#121a14;--ink:#0d130e;--cream:#edddc3;--cream-2:#cfc1a8;--muted:#a89d89;--gold:#c69a51;--gold-2:#ac8039;--gold-hi:#e2c07f;--line:rgba(198,154,81,.22);--sans:'Red Hat Display',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--ink);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0}
.bg video{width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.38);transform:scale(1.2)}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,19,14,.4),rgba(13,19,14,.92) 60%)}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:36px 20px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:190px;margin-bottom:14px}
.sub{font-size:15px;color:var(--cream-2);margin-bottom:22px;line-height:1.45}
.links{width:100%;display:grid;gap:10px}
.l{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 18px;border-radius:16px;border:1px solid var(--line);background:rgba(29,42,31,.78);backdrop-filter:blur(10px);color:var(--cream);text-decoration:none;font-weight:600;font-size:16px}
.l.p{height:72px;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 50%,var(--gold-2));color:#17120a;border:0;box-shadow:0 14px 34px -12px rgba(198,154,81,.7);font-size:18px}
.drop{width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(29,42,31,.78);backdrop-filter:blur(10px);text-align:left}
.drop b{display:block;font-size:16px;margin-bottom:10px;text-align:center}
.drop .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.drop input{height:44px;width:100%;border:1px solid rgba(237,221,195,.2);border-radius:12px;background:rgba(13,19,14,.55);color:var(--cream);padding:0 12px;font:500 14px var(--sans);outline:none}
.drop input:focus{border-color:var(--gold)}
.drop .btn{width:100%;height:48px;border:0;border-radius:14px;cursor:pointer;font:600 15px var(--sans);background:linear-gradient(135deg,var(--gold-hi),var(--gold) 50%,var(--gold-2));color:#17120a}
.drop .ok{display:none;text-align:center;font-size:14px;color:var(--cream-2);padding:8px 0 2px}
.drop.done .row,.drop.done .btn{display:none}
.drop.done .ok{display:block}
.ph{display:inline-flex;border:1px dashed var(--gold);color:var(--gold-hi);border-radius:6px;padding:0 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg"><video id="bg" autoplay muted loop playsinline></video></div>
<main>
  <img class="logo" src="assets/img/logo-wordmark.png" alt="Cigar Club Miami">
  <p class="sub">Downtown Miami cigar lounge &amp; bar. Private events for up to 50.</p>
  <nav class="links">
    <a class="l p" href="index.html?nogate#lead">Book your event</a>
    <a class="l" href="index.html?nogate#get">Shop cigars</a>
  </nav>
  <form class="drop" id="drop" style="margin-top:10px" onsubmit="return alertMe(event)">
    <b>Get rare-drop alerts</b>
    <div class="row">
      <input type="email" name="email" placeholder="Email" required>
      <input type="tel" name="phone" placeholder="Phone" required>
    </div>
    <button class="btn" type="submit">Alert me</button>
    <p class="ok">You're on the list. We'll be in touch.</p>
  </form>
  <nav class="links" style="margin-top:10px">
    <a class="l" href="https://maps.google.com/?q=Cigar+Club+Miami+106+NE+1st+St+Miami+FL+33132" target="_blank" rel="noopener">Directions</a>
    <a class="l" href="tel:">Call <span class="ph">Elad to confirm</span></a>
  </nav>
  <p class="foot">106 NE 1st St, Miami · 21+</p>
</main>
<script>
const HERO_LOOP='assets/hero-khaled-graded-bg.mp4',HERO_POSTER='assets/hero-khaled-graded-poster.jpg';
const v=document.getElementById('bg');v.poster=HERO_POSTER;v.src=HERO_LOOP;v.play().catch(()=>{});
function alertMe(e){e.preventDefault();document.getElementById('drop').classList.add('done');return false}
</script>
</body></html>
